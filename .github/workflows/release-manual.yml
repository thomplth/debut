name: Manual Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which version number to raise
        required: true
        type: choice
        default: minor
        options:
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      sha: ${{ github.sha }}

    steps:
      # Pinned to the dispatch commit rather than to main, because that is the commit the CI and
      # E2E gates check out. Planning from a newer main would gate one commit and publish another.
      - name: Check out the commit to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # No change requirement: a human asking for this release has already decided it is wanted.
      - name: Plan the release
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: ./scripts/release-plan.sh "$BUMP" | tee -a "$GITHUB_OUTPUT"

      - name: Summarise the plan
        run: |
          echo "Releasing v${{ steps.plan.outputs.version }} (${{ inputs.bump }} bump from ${{ steps.plan.outputs.previous_tag }})." \
              >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: [plan]
    uses: ./.github/workflows/ci.yml

  e2e:
    needs: [plan]
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: [plan, ci, e2e]
    permissions:
      contents: write
    uses: ./.github/workflows/release-publish.yml
    # GitHub only resolves the called job's stable-release environment secrets when the
    # same-repository caller enables secret inheritance. The called job still selects and gates
    # the protected environment; the daily caller deliberately does not inherit secrets.
    secrets: inherit
    with:
      channel: stable
      version: ${{ needs.plan.outputs.version }}
      previous_tag: ${{ needs.plan.outputs.previous_tag }}
      sha: ${{ needs.plan.outputs.sha }}
