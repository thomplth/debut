name: Publish Release

# Stable wrapper called only after the manual workflow passes CI and E2E.
# Nightly publication binds its environment directly and uses the shared action.
on:
  workflow_call:
    inputs:
      channel:
        description: Nightly prerelease or manually promoted stable release
        required: true
        type: string
      version:
        description: The version to release, without the leading v
        required: true
        type: string
      build_version:
        description: Monotonic numeric bundle build recorded in the release tag
        required: true
        type: string
      previous_tag:
        description: The tag the release notes start after, empty for the first release
        required: false
        default: ''
        type: string
      sha:
        description: The commit the CI and E2E gates tested
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: inputs.channel == 'stable'
    runs-on: macos-26
    timeout-minutes: 30
    environment: stable-release

    env:
      DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
      DEVELOPER_IDENTITY: ${{ vars.DEVELOPER_IDENTITY }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Check out the commit the gates tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Publish the signed stable release
        uses: ./.github/actions/publish-release
        with:
          channel: ${{ inputs.channel }}
          version: ${{ inputs.version }}
          build_version: ${{ inputs.build_version }}
          previous_tag: ${{ inputs.previous_tag }}
          sha: ${{ inputs.sha }}
