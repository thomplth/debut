name: Publish Release

# Only reachable from the daily and manual release workflows, so a release can never bypass
# the CI and E2E gates they run first.
on:
  workflow_call:
    inputs:
      version:
        description: The version to release, without the leading v
        required: true
        type: string
      previous_tag:
        description: The tag the release notes start after, empty for the first release
        required: false
        default: ''
        type: string
      sha:
        description: The commit the CI and E2E gates tested
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out the commit the gates tested
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Refuse to release a commit the gates never saw
        env:
          SHA: ${{ inputs.sha }}
        run: ./scripts/verify-release-commit.sh "$SHA"

      - name: Select the macOS 26 toolchain
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
          echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> "$GITHUB_ENV"

      - name: Record the version being released
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/apply-version.sh "$VERSION"

      # Written before the version bump is committed, so the notes describe the work being
      # released rather than the release commit itself.
      - name: Write the release notes
        env:
          VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: ./scripts/release-notes.sh "$PREVIOUS_TAG" "v$VERSION" | tee "$RUNNER_TEMP/notes.md"

      - name: Commit and tag the release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
              echo "Sources already state $VERSION; tagging the existing commit."
          else
              git commit -am "Release v$VERSION"
          fi
          git tag -a "v$VERSION" -m "Debut v$VERSION"

      - name: Build the disk image
        run: ./scripts/package-dmg.sh

      - name: Push the release commit and tag
        run: git push origin HEAD:main --follow-tags

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "Debut v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            .build/Debut.dmg
