name: Daily Release

on:
  schedule:
    # 02:00 UTC, clear of the working day in every timezone the project is used from.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build_version: ${{ steps.plan.outputs.build_version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      should_release: ${{ steps.plan.outputs.should_release }}
      sha: ${{ github.sha }}

    steps:
      # Pinned to the triggering commit rather than to main, because that is the commit the CI and
      # E2E gates check out. Planning from a newer main would gate one commit and publish another.
      - name: Check out the commit to release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Plan the nightly release
        id: plan
        run: ./scripts/release-plan.sh nightly --require-changes | tee -a "$GITHUB_OUTPUT"

      - name: Summarise the plan
        run: |
          if [[ "${{ steps.plan.outputs.should_release }}" == "true" ]]; then
              echo "Releasing v${{ steps.plan.outputs.version }}." >> "$GITHUB_STEP_SUMMARY"
          else
              echo "No commits since ${{ steps.plan.outputs.previous_tag }}; nothing to release." \
                  >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    needs: [plan]
    if: needs.plan.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml

  e2e:
    needs: [plan]
    if: needs.plan.outputs.should_release == 'true'
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: [plan, ci, e2e]
    if: needs.plan.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 30
    environment: daily-release
    env:
      DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      DEVELOPER_IDENTITY: ${{ vars.DEVELOPER_IDENTITY }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: Publish the signed nightly
        uses: ./.github/actions/publish-release
        with:
          channel: daily
          version: ${{ needs.plan.outputs.version }}
          build_version: ${{ needs.plan.outputs.build_version }}
          previous_tag: ${{ needs.plan.outputs.previous_tag }}
          sha: ${{ needs.plan.outputs.sha }}
