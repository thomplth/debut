name: E2E

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the calling workflow too, so a release gate and a pull request run on the same ref
  # never cancel each other.
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are worth cancelling; a run gating a release is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify workflow contract
        run: Tests/CI/E2EWorkflowTests.sh

      - name: Run E2E suite
        run: ./scripts/ci-e2e.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debut-e2e-evidence
          path: |
            /tmp/debut-e2e-screenshots
            ~/Library/Application Support/Debut/diagnostic.json
          if-no-files-found: warn
          retention-days: 7
